name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend test image
        run: docker build --target test -t freelancer-backend-test ./backend
      - name: Run backend tests
        run: docker run --rm freelancer-backend-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  compose-and-static:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      ADMIN_PASSWORD: ci-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config -q
      - name: Build runtime images
        run: docker compose build
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Scan tracked files for credential patterns
        run: ./scripts/check-secrets.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
