name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build backend test image
        run: docker build --target test -t freelancer-backend-test ./backend
      - name: Run backend tests
        run: docker run --rm freelancer-backend-test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  compose-and-static:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-placeholder
      JWT_SECRET: ci-only-placeholder
      ADMIN_PASSWORD: ci-only-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose
        run: docker compose config -q
      - name: Build runtime images
        run: docker compose build
      - name: Validate shell scripts
        run: bash -n scripts/*.sh
      - name: Scan tracked files for credential patterns
        run: ./scripts/check-secrets.sh
      - name: Generate pilot SBOM
        run: ./scripts/generate-pilot-sbom.py --output build/pilot-sbom.cdx.json --revision "${{ github.sha }}"
      - name: Upload pilot SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-sbom
          path: build/pilot-sbom.cdx.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Run JVM tests and build app/instrumentation APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest

  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Install acceptance dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils restic
      - name: Run disposable product acceptance
        run: make full-check

  android-api35-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: freelancer-android-${{ github.run_id }}
      POSTGRES_PASSWORD: synthetic-android-db-${{ github.run_id }}
      JWT_SECRET: synthetic-android-jwt-${{ github.run_id }}-${{ github.run_attempt }}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: synthetic-android-admin-${{ github.run_id }}
      FRONTEND_PORT: 8080
      SMTP_HTTP_PORT: 8025
      PROXY_NETWORK_NAME: proxy_net
      PRODUCT_VERSION: 0.2.0
      REPOSITORY_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Enable KVM access for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start synthetic API stack
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export BUILD_TIME
          docker network create proxy_net
          docker compose -f docker-compose.yml -f docker-compose.full-check.yml up -d --build db smtp-fixture backend frontend
          for attempt in $(seq 1 90); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.full-check.yml ps
          exit 1
      - name: Seed unmistakably synthetic pilot data
        run: >-
          python3 tests/android-smoke/seed.py
          --base-url http://127.0.0.1:8080
          --username "$ADMIN_USERNAME"
          --password "$ADMIN_PASSWORD"
      - name: Run API 35 emulator smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            cd android && ./gradlew connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.serverUrl=http://10.0.2.2:8080/
            -Pandroid.testInstrumentationRunnerArguments.username="$ADMIN_USERNAME"
            -Pandroid.testInstrumentationRunnerArguments.password="$ADMIN_PASSWORD"
      - name: Clean synthetic API stack
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.full-check.yml down --volumes --remove-orphans
          docker network rm proxy_net || true
