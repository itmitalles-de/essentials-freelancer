services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: tracker
    volumes:
      - tracker_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tracker:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/tracker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      SMTP_RATE_LIMIT_PER_MINUTE: ${SMTP_RATE_LIMIT_PER_MINUTE:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REPOSITORY_REVISION: ${REPOSITORY_REVISION:-unknown}
      OFFSITE_REPOSITORY_CONFIGURED: ${OFFSITE_REPOSITORY_CONFIGURED:-false}
      OFFSITE_PASSWORD_FILE_CONFIGURED: ${OFFSITE_PASSWORD_FILE_CONFIGURED:-false}
      PDF_STORAGE_DIR: /data/invoices
    volumes:
      - tracker_invoices:/data/invoices
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - default
      - proxy_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  freelancer-dashboard:
    image: b4bz/homer:v26.4.2
    restart: unless-stopped
    user: "1000:1000"
    environment:
      INIT_ASSETS: "0"
    volumes:
      - ./dashboard/assets:/www/assets:ro
    ports:
      - "${DASHBOARD_PORT:-8081}:8080"
    networks:
      - proxy_net

volumes:
  tracker_db_data:
  tracker_invoices:

networks:
  default:
  proxy_net:
    external: true
    name: ${PROXY_NETWORK_NAME:-proxy_net}
