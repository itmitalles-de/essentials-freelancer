services:
  db:
    environment:
      # Test-only: the volumes are disposable and durability across a host crash
      # is outside this functional export/restore rehearsal.
      POSTGRES_INITDB_ARGS: "--no-sync"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 120s

  backend:
    environment:
      SMTP_HOST: smtp-fixture
      SMTP_PORT: 1025
      SMTP_FROM: freelancer@example.invalid
      SMTP_USE_TLS: "false"
      SMTP_TIMEOUT_SECONDS: 1
      SMTP_RATE_LIMIT_PER_MINUTE: 100
    depends_on:
      smtp-fixture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 120s

  smtp-fixture:
    build: ./tests/full-check/smtp-fixture
    restart: unless-stopped
    expose:
      - "1025"
      - "8025"
    ports:
      - "${SMTP_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8025/health', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 20

  freelancer-dashboard:
    profiles: ["dashboard"]
